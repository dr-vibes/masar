name: MASAR quality and documentation

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify financial and rental logic
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Documentation guard
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run docs:check
